name: verify
# Core/full checks include validate:provenance, scan:licenses and validate:sbom.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Select checks
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          # Shared router: tools/ci-scope.ts (pure function + thin CLI).
          # shell: bash runs with -eo pipefail, so a git failure fails the step.
          if [[ "$EVENT" == pull_request ]]; then
            mode=$(git diff --name-only -z "$BASE" HEAD | node tools/ci-scope.ts)
          else
            mode=$(node tools/ci-scope.ts < /dev/null)
          fi
          echo "$mode" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Run selected checks
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          DEPENDENCY_AUDIT_STRICT: '1'
        shell: bash
        run: |
          case "$MODE" in
            docs) pnpm run format:check && pnpm run validate:docs ;;
            core) pnpm run check ;;
            full) pnpm run verify:cloud ;;
            *) exit 1 ;;
          esac

  runtime-node22:
    needs: verify
    if: needs.verify.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - name: Build candidate host packages
        run: node --experimental-strip-types tools/build-host-packages.ts
      - name: Runtime smoke of a real extracted zip
        run: node --experimental-strip-types tools/verify-zip-runtime.ts
