name: verify
# Core/full checks include validate:provenance, scan:licenses and validate:sbom.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          mode=full
          if [[ "$EVENT" == pull_request ]]; then
            mode=docs
            paths=$(git diff --name-only "$BASE" HEAD)
            while IFS= read -r path; do
              case "$path" in
                docs/*|README.md|README.en.md) ;;
                packages/personality-assessment/*|packages/psychology-contracts/*|skills/psychology-self-assessment/*|tools/*psychology*|packages/contracts/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.github/*|tools/*|AGENTS.md|tsconfig*|eslint*) mode=full; break ;;
                packages/*|skills/xuan-ji-yu-heng/*|evals/*|examples/*) mode=core ;;
                *) mode=full; break ;;
              esac
            done <<< "$paths"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run selected checks
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          DEPENDENCY_AUDIT_STRICT: '1'
        shell: bash
        run: |
          case "$MODE" in
            docs) pnpm run format:check && pnpm run validate:docs ;;
            core) pnpm run check ;;
            full) pnpm run verify:cloud ;;
            *) exit 1 ;;
          esac

  runtime-node22:
    needs: verify
    if: needs.verify.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - name: Build candidate host packages
        run: node --experimental-strip-types tools/build-host-packages.ts
      - name: Runtime smoke of a real extracted zip
        run: node --experimental-strip-types tools/verify-zip-runtime.ts
