<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>{{TITLE}}</title>
    <!--
      Self-contained report shell (handoff §7.2): no CDN, no remote fonts, no
      scripts, strict CSP. The engine injects ONLY escaped content generated from
      a ChartBundle into {{REPORT_BODY}}; this file never computes anything.
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        margin: 0;
        padding: 1.5rem;
        line-height: 1.5;
        background: #0f1115;
        color: #e6e6e6;
      }
      main {
        max-width: 60rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.25rem;
      }
      h2 {
        font-size: 1.05rem;
        margin: 1.5rem 0 0.5rem;
        border-bottom: 1px solid #333;
        padding-bottom: 0.25rem;
      }
      .sub {
        color: #9aa0a6;
        font-size: 0.85rem;
        margin: 0 0 1rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.9rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.35rem 0.5rem;
        border-bottom: 1px solid #262a31;
        vertical-align: top;
      }
      th {
        color: #9aa0a6;
        font-weight: 600;
        width: 14rem;
      }
      .warn {
        border-left: 3px solid #d0a215;
        padding: 0.35rem 0.6rem;
        margin: 0.35rem 0;
        background: #1a1c22;
        font-size: 0.88rem;
      }
      .warn.info {
        border-left-color: #3b82f6;
      }
      .badge {
        display: inline-block;
        font-size: 0.7rem;
        padding: 0.1rem 0.4rem;
        border-radius: 0.3rem;
        background: #262a31;
        color: #9aa0a6;
        margin-left: 0.35rem;
      }
      pre {
        background: #0b0d11;
        border: 1px solid #262a31;
        padding: 0.75rem;
        overflow: auto;
        font-size: 0.8rem;
        border-radius: 0.4rem;
      }
      .disclaimer {
        font-size: 0.8rem;
        color: #9aa0a6;
        margin-top: 1.5rem;
        border-top: 1px solid #333;
        padding-top: 0.75rem;
      }
      svg {
        max-width: 320px;
        display: block;
        margin: 0.5rem 0;
      }
    </style>
  </head>
  <body>
    <main>{{REPORT_BODY}}</main>
  </body>
</html>
